  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const sceneOne = document.querySelector('.f01-dois-consensos-scene-one');
      const sceneTwo = document.querySelector('.f01-dois-consensos-scene-two');
      const sceneThree = document.querySelector('.f01-dois-consensos-scene-three');
      const partyBands = Array.from(document.querySelectorAll('.f01-dois-consensos-party-band'));
      const rulerHalves = document.querySelectorAll('.f01-dois-consensos-ruler-half');
      const rulerTicks = document.querySelectorAll('.f01-dois-consensos-ruler-tick');
      const discreteText = document.getElementById('f01-dois-consensos-discrete-text');
      const arrows = document.querySelectorAll('.f01-dois-consensos-arrow');

      gsap.set([sceneTwo, sceneThree], { opacity: 0 });
      gsap.set('.f01-dois-consensos-quase', { opacity: 0 });
      gsap.set(rulerTicks, { opacity: 0 });

      const CONTENT = partyBands.map((element) => ({
        element,
        title: element.dataset.sequenceTitle,
        body: element.dataset.sequenceTitle,
        hold: 0.12
      }));
      let cumulative = 0;
      const BAND_TIMELINE = CONTENT.map((entry) => {
        const duration = 0.34 + entry.body.length * 0.018 + entry.hold;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });

      BAND_TIMELINE.forEach((entry, index) => {
        tl.fromTo(
          entry.element,
          { y: index === 0 ? -180 : 180, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.64, ease: 'power4.out' },
          0.08 + entry.start
        );
      });
      tl.fromTo(
        '.f01-dois-consensos-register.is-v',
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 0.34, duration: 0.72, ease: 'power3.out' },
        1.34
      );
      tl.fromTo(
        '.f01-dois-consensos-register.is-h',
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 0.34, duration: 0.68, ease: 'power3.out' },
        1.62
      );
      tl.fromTo(
        '.f01-dois-consensos-corner',
        { scale: 0.55, opacity: 0 },
        { scale: 1, opacity: 0.45, duration: 0.42, stagger: 0.1, ease: 'power3.out' },
        1.86
      );

      tl.to(sceneOne, { y: -230, duration: 0.3, ease: 'power4.in' }, 2.1);
      tl.to(sceneOne, { opacity: 0, duration: 0.28, ease: 'power1.in' }, 2.12);
      tl.set(sceneOne, { opacity: 0 }, 2.4);
      tl.fromTo(
        sceneTwo,
        { y: 230, opacity: 0.35 },
        { y: 0, opacity: 1, duration: 0.32, ease: 'power4.out' },
        2.4
      );

      const DISCRETE_SEQUENCE = [
        { t: 0, text: '' },
        { t: 0.025, text: 'DISCORDAM' }
      ];
      const textAt = (time) => {
        for (let i = DISCRETE_SEQUENCE.length - 1; i >= 0; i -= 1) {
          if (time >= DISCRETE_SEQUENCE[i].t) return DISCRETE_SEQUENCE[i].text;
        }
        return '';
      };
      const discreteDriver = { t: 0 };
      let lastText = null;
      tl.to(
        discreteDriver,
        {
          t: 0.3,
          duration: 0.3,
          ease: 'none',
          onUpdate: () => {
            const nextText = textAt(discreteDriver.t);
            if (nextText !== lastText) {
              discreteText.textContent = nextText;
              lastText = nextText;
            }
          }
        },
        2.4
      );

      tl.fromTo(
        rulerHalves,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 1.08, stagger: 0.05, ease: 'power3.out' },
        3.18
      );
      tl.fromTo(
        rulerTicks,
        { scaleY: 0.2, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.38, stagger: 0.06, ease: 'power3.out' },
        3.98
      );
      tl.fromTo(
        '.f01-dois-consensos-quase',
        { y: 52, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.58, ease: 'power4.out' },
        4.34
      );

      tl.to(sceneTwo, { scale: 0.8, filter: 'blur(10px)', duration: 0.2, ease: 'power3.in' }, 5.1);
      tl.to(sceneTwo, { opacity: 0.15, duration: 0.2, ease: 'none' }, 5.1);
      tl.set(sceneTwo, { opacity: 0 }, 5.3);
      tl.set(sceneThree, { opacity: 0.15, scale: 1, filter: 'blur(10px)' }, 5.3);
      tl.to(
        sceneThree,
        { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.5, ease: 'expo.out' },
        5.3
      );
      tl.fromTo(
        '.f01-dois-consensos-consenso',
        { scale: 0.68, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.82, ease: 'power3.out' },
        5.34
      );
      tl.fromTo(
        '.f01-dois-consensos-direction-label',
        { y: 46, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.56, ease: 'power3.out' },
        6.16
      );
      tl.fromTo(
        '.f01-dois-consensos-direction-rule',
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.48, ease: 'power3.out' },
        6.46
      );

      arrows.forEach((arrow, index) => {
        tl.fromTo(
          arrow,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.6, opacity: 0 },
          {
            x: Number(arrow.dataset.targetX),
            y: Number(arrow.dataset.targetY),
            scale: 1,
            opacity: 1,
            duration: 1.28,
            ease: 'power3.out'
          },
          6.48 + index * 0.06
        );
      });

      window.__timelines = window.__timelines || {};
      window.__timelines['01-dois-consensos'] = tl;
    })();
  </script>
