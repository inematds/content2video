  <script>
    (() => {
      const byId = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["02-gesto"] = tl;

      const spectacle = byId("02-gesto-spectacle");
      const wordUm = byId("02-gesto-word-um");
      const wordGesto = byId("02-gesto-word-gesto");
      const wordEspetacular = byId("02-gesto-word-espetacular");
      const pivot = byId("02-gesto-pivot");
      const fragmentField = byId("02-gesto-fragment-field");
      const fragments = [1, 2, 3].map((n) => byId(`02-gesto-fragment-${n}`));
      const rows = [1, 2, 3].map((n) => byId(`02-gesto-row-${n}`));
      const ledger = byId("02-gesto-ledger");
      const progress = byId("02-gesto-progress");
      const progressFill = byId("02-gesto-progress-fill");
      const ticks = [1, 2, 3].map((n) => byId(`02-gesto-tick-${n}`));

      tl.set([pivot, fragmentField, ledger, progress], { opacity: 0 }, 0);
      tl.set(fragments, { opacity: 0, x: 230 }, 0);
      tl.set(rows, { opacity: 0, x: 230 }, 0);
      tl.set(progressFill, { scaleX: 0 }, 0);

      // Scene 1 — one pulse grid, three distinct percussive entrances.
      const PULSE = 0.24;
      const BEATS = [PULSE * 0.5, PULSE * 2.5, PULSE * 4.75];

      tl.fromTo(
        wordUm,
        { scale: 1.55, filter: "blur(10px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.46, ease: "power4.out" },
        BEATS[0],
      );
      tl.fromTo(
        wordGesto,
        { x: -190, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.44, ease: "expo.out" },
        BEATS[1],
      );
      tl.fromTo(
        wordEspetacular,
        { y: 82, rotation: 4, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.55, ease: "circ.out" },
        BEATS[2],
      );

      ticks.forEach((tick, index) => {
        tl.fromTo(
          tick,
          { opacity: 0.18, scaleX: 0.2 },
          { opacity: 1, scaleX: 1, duration: 0.18, ease: "power4.out" },
          BEATS[index],
        );
      });

      tl.to(
        wordEspetacular,
        { scaleX: 1.11, x: 34, duration: 0.48, ease: "power3.in" },
        1.72,
      );

      // Scene 1 → 2 — cut-the-curve carries the failed gesture leftward.
      tl.to(spectacle, { x: -230, duration: 0.32, ease: "power4.in" }, 2.18);
      tl.to(spectacle, { opacity: 0, duration: 0.26, ease: "power1.in" }, 2.22);

      tl.fromTo(
        pivot,
        { opacity: 0.35, x: 230 },
        { opacity: 1, x: 0, duration: 0.34, ease: "power4.out" },
        2.40,
      );
      tl.set(fragmentField, { opacity: 1 }, 2.40);
      fragments.forEach((fragment, index) => {
        const onset = 2.44 + index * 0.56;
        tl.fromTo(
          fragment,
          { x: 230, opacity: 0.35 },
          { x: 0, opacity: 1, duration: 0.36, ease: "power4.out" },
          onset,
        );
        tl.to(
          fragment,
          { y: 46 + index * 18, duration: 0.64, ease: "power2.inOut" },
          onset + 0.36,
        );
      });

      // Scene 2 → 3 — same leftward velocity through the hard seam.
      tl.to(fragmentField, { x: -230, duration: 0.32, ease: "power4.in" }, 4.48);
      tl.to(fragmentField, { opacity: 0, duration: 0.26, ease: "power1.in" }, 4.52);
      tl.fromTo(
        ledger,
        { x: 230, opacity: 0.35 },
        { x: 0, opacity: 1, duration: 0.36, ease: "power4.out" },
        4.80,
      );
      tl.fromTo(
        progress,
        { x: 230, opacity: 0.35 },
        { x: 0, opacity: 1, duration: 0.36, ease: "power4.out" },
        4.80,
      );

      // Content-aware accumulation: absolute row onsets are derived once from copy length.
      const CONTENT = [
        { title: "PEQUENO", body: "PEQUENO", hold: 0.22 },
        { title: "SIMPLES", body: "SIMPLES", hold: 0.22 },
        { title: "REPETÍVEL", body: "REPETÍVEL", hold: 0.72 },
      ];
      const BASE_DURATION = 0.70;
      const SEC_PER_CHAR = 0.035;
      let cumulative = 0;
      const TIMELINE = CONTENT.map((entry) => {
        const duration = BASE_DURATION + entry.body.length * SEC_PER_CHAR + entry.hold;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });
      const SEQUENCE_START = 4.94;
      const LAST_ONSET_SPAN = 1.72;
      const rawLastStart = TIMELINE[TIMELINE.length - 1].start;

      TIMELINE.forEach((entry, index) => {
        const onset = SEQUENCE_START + (entry.start / rawLastStart) * LAST_ONSET_SPAN;
        tl.fromTo(
          rows[index],
          { x: 230, opacity: 0.35 },
          { x: 0, opacity: 1, duration: 0.42 + index * 0.06, ease: "power4.out" },
          onset,
        );
      });

      tl.to(progressFill, { scaleX: 1, duration: 2.18, ease: "none" }, SEQUENCE_START);
      tl.fromTo(
        byId("02-gesto-row-3").querySelector('[class~="02-gesto-ledger-title"]'),
        { scale: 0.96 },
        { scale: 1, duration: 0.58, ease: "expo.out" },
        6.66,
      );
    })();
