      const anchor = document.getElementById("06-retomar-anchor");
      const anchorRule = document.getElementById("06-retomar-anchor-rule");
      const calendar = document.getElementById("06-retomar-calendar");

      const nextFill = document.getElementById("06-retomar-next-fill");
      const flowline = document.getElementById("06-retomar-flowline");
      const flowLabel = document.getElementById("06-retomar-flow-label");
      const priorFills = Array.from(document.querySelectorAll('[class~="06-retomar-calendar-grid"] [class~="06-retomar-day-fill"]')).slice(0, 5);

      tl.set(next, { opacity: 0 }, 0);
      tl.fromTo(anchor, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.48, ease: "expo.out" }, 0);
      tl.fromTo(anchorRule, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.62, ease: "power3.out", transformOrigin: "0 50%" }, 0.22);
      tl.fromTo(calendar, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 0.34);
      tl.fromTo(priorFills, { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.28, stagger: 0.16, ease: "power3.out" }, 0.72);

      tl.fromTo(stateWrap, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.44, ease: "power3.out" }, 1.58);

      const stateSequence = [
        { t: 1.80, text: "REPETIR" },
        { t: 2.92, text: "PAUSA" },
        { t: 4.08, text: "RETOMAR" },
        { t: 5.50, text: "CONTINUAR" }
      ];
      const stateAt = (time) => {
        for (let i = stateSequence.length - 1; i >= 0; i -= 1) {
          if (time >= stateSequence[i].t) return stateSequence[i].text;
        }
        return "";
      };
      const driver = { t: 0 };
      tl.to(driver, {
        t: 7.752,
        duration: 7.752,
        ease: "none",
        onUpdate: () => { state.textContent = stateAt(driver.t); }
      }, 0);

      tl.fromTo(gap, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out" }, 2.84);
      tl.fromTo(flowline, { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.72, ease: "power3.out", transformOrigin: "0 0" }, 3.66);
      tl.fromTo(flowLabel, { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 4.34);

      tl.set(next, { opacity: 1 }, 5.5);
