    document.fonts.ready.then(() => {
      const root = document.querySelector('[data-composition-id="06-barreiras"]');
      const world = root.querySelector('#f06-world');
      const headline = root.querySelector('#f06-headline');
      const cam = { scale: 1, x: 0, y: 0 };

      function applyCamera() {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      }

      function fitHeadline() {
        const maxWidth = 918;
        let size = 126;
        headline.style.fontSize = `${size}px`;
        while (headline.getBoundingClientRect().width > maxWidth && size > 88) {
          size -= 2;
          headline.style.fontSize = `${size}px`;
        }
        if (headline.getBoundingClientRect().width > maxWidth) {
          headline.style.letterSpacing = '-0.035em';
        }
      }

      fitHeadline();
      applyCamera();

      const drawn = root.querySelectorAll(
        '#f06-rail, #f06-rail-cap, #f06-bridge-left, #f06-bridge-right, #f06-logic-shape, #f06-pulse-line, #f06-open-shape, #f06-eye-outline, #f06-eye-ring, #f06-ear-outline, #f06-ear-inner, #f06-hand-outline'
      );
      drawn.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      const tl = gsap.timeline({ paused: true });

      tl.fromTo('#f06-kicker', { autoAlpha: 0, y: -16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power1.out' }, 0.02);
      tl.fromTo('#f06-headline', { autoAlpha: 0, y: 22 }, { autoAlpha: 1, y: 0, duration: 0.56, ease: 'power2.out' }, 0.08);
      tl.to('#f06-rail', { strokeDashoffset: 0, duration: 6.72, ease: 'none' }, 0.26);
      tl.to('#f06-rail-cap', { strokeDashoffset: 0, duration: 0.28, ease: 'power2.out' }, 6.75);

      tl.to(cam, { y: -620, duration: 0.62, ease: 'power3.inOut', onUpdate: applyCamera }, 0.88);
      tl.fromTo('#f06-transfer', { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.48, ease: 'power2.out' }, 1.5);
      tl.to('#f06-bridge-left', { strokeDashoffset: 0, duration: 0.58, ease: 'power2.out' }, 1.72);
      tl.to('#f06-bridge-right', { strokeDashoffset: 0, duration: 0.58, ease: 'power2.out' }, 2.14);

      tl.to(cam, { y: -1680, duration: 0.5, ease: 'power3.inOut', onUpdate: applyCamera }, 3.1);
      tl.fromTo('#f06-emotion', { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.46, ease: 'power2.out' }, 3.58);
      tl.to('#f06-logic-shape', { strokeDashoffset: 0, duration: 0.54, ease: 'power2.out' }, 3.78);
      tl.to('#f06-pulse-line', { strokeDashoffset: 0, duration: 0.72, ease: 'none' }, 4.16);
      tl.to('#f06-open-shape', { strokeDashoffset: 0, duration: 0.54, ease: 'power2.out' }, 4.66);

      tl.to(cam, { y: -2700, duration: 0.5, ease: 'power3.inOut', onUpdate: applyCamera }, 5.08);
      tl.fromTo('#f06-perception', { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.42, ease: 'power2.out' }, 5.56);
      tl.to('#f06-eye-outline', { strokeDashoffset: 0, duration: 0.46, ease: 'power2.out' }, 5.72);
      tl.to('#f06-eye-ring', { strokeDashoffset: 0, duration: 0.34, ease: 'power2.out' }, 5.98);
      tl.to('#f06-ear-outline', { strokeDashoffset: 0, duration: 0.52, ease: 'power2.out' }, 5.9);
      tl.to('#f06-ear-inner', { strokeDashoffset: 0, duration: 0.34, ease: 'power2.out' }, 6.26);
      tl.to('#f06-hand-outline', { strokeDashoffset: 0, duration: 0.7, ease: 'power2.out' }, 6.04);

      const pulse = { phase: 0 };
      const eyeDot = root.querySelector('#f06-eye-dot');
      const eyeRing = root.querySelector('#f06-eye-ring');
      tl.to(pulse, {
        phase: Math.PI * 2,
        duration: 0.88,
        ease: 'none',
        onUpdate: () => {
          const dotScale = 1 + Math.sin(pulse.phase) * 0.1;
          const ringScale = 1 + Math.sin(pulse.phase + Math.PI / 2) * 0.05;
          eyeDot.setAttribute('transform', `translate(75 76) scale(${dotScale}) translate(-75 -76)`);
          eyeRing.setAttribute('transform', `translate(75 76) scale(${ringScale}) translate(-75 -76)`);
        }
      }, 6.12);

      tl.to(cam, { y: -3500, duration: 0.44, ease: 'power3.inOut', onUpdate: applyCamera }, 6.66);
      tl.fromTo('#f06-terminal', { autoAlpha: 0, y: 28 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 7.1);
      tl.fromTo('#f06-gap', { scale: 0.9 }, { scale: 1, duration: 0.42, ease: 'power2.out' }, 7.14);

      const sampleTimes = [0, 0.32, 0.64];
      for (const sample of sampleTimes) {
        tl.seek(sample, false);
        const rect = headline.getBoundingClientRect();
        const rootRect = root.getBoundingClientRect();
        const left = rect.left - rootRect.left;
        const right = rect.right - rootRect.left;
        const top = rect.top - rootRect.top;
        const bottom = rect.bottom - rootRect.top;
        const safeLeft = rootRect.width * 0.075;
        const safeRight = rootRect.width * 0.925;
        const safeTop = rootRect.height * 0.06;
        const safeBottom = rootRect.height * 0.94;
        if (left < safeLeft - 0.5 || right > safeRight + 0.5 || top < safeTop - 0.5 || bottom > safeBottom + 0.5) {
          throw new Error(`06-barreiras headline unsafe at ${sample}s`);
        }
      }
      tl.seek(0, false);
      window.__timelines['06-barreiras'] = tl;
    });
