  <script>
    (() => {
      const DURATION = 6.912;
      const frameId = "01-o-salto";
      const headlineEl = document.getElementById("f01-o-salto-headline");
      const probeEl = document.getElementById("f01-o-salto-headline-probe");
      const languageStateEl = document.getElementById("f01-o-salto-language-state");

      const WORD_CONTENT = [
        { key: "o", text: "O", body: "", hold: 0.12 },
        { key: "salto", text: "O salto", body: "", hold: 0.18 },
        { key: "nao", text: "O salto não é", body: "", hold: 0.42 }
      ];
      const BASE_DURATION = 0.18;
      const SEC_PER_CHAR = 0.035;
      let wordCumulative = 0;
      const WORD_TIMELINE = WORD_CONTENT.map((entry) => {
        const start = wordCumulative;
        wordCumulative += BASE_DURATION + entry.body.length * SEC_PER_CHAR + entry.hold;
        return { ...entry, start, end: wordCumulative };
      });

      const HEADLINE_SEQUENCE = [
        { t: 1.6, key: "better", text: "Responder melhor" },
        { t: 3.3, key: "learn", text: "Aprender" },
        { t: 5.6, key: "elsewhere", text: "Em outro lugar" }
      ];

      function wordAt(time) {
        for (let i = WORD_TIMELINE.length - 1; i >= 0; i -= 1) {
          if (time >= WORD_TIMELINE[i].start) return WORD_TIMELINE[i];
        }
        return WORD_TIMELINE[0];
      }

      function headlineAt(time) {
        for (let i = HEADLINE_SEQUENCE.length - 1; i >= 0; i -= 1) {
          if (time >= HEADLINE_SEQUENCE[i].t) return HEADLINE_SEQUENCE[i];
        }
        return wordAt(time);
      }

      const fittedSizes = new Map();
      function measureHeadline(text) {
        probeEl.textContent = text;
        let size = 136;
        let tracking = -0.022;
        probeEl.style.fontSize = `${size}px`;
        probeEl.style.letterSpacing = `${tracking}em`;
        let box = probeEl.getBoundingClientRect();
        while ((box.width > 918 || box.height > 461) && size > 92) {
          size -= 2;
          if (size < 112) tracking = -0.026;
          probeEl.style.fontSize = `${size}px`;
          probeEl.style.letterSpacing = `${tracking}em`;
          box = probeEl.getBoundingClientRect();
        }
        return { size, tracking };
      }

      function applyHeadline(entry) {
        const fit = fittedSizes.get(entry.text) || { size: 118, tracking: -0.024 };
        headlineEl.textContent = entry.text;
        headlineEl.style.fontSize = `${fit.size}px`;
        headlineEl.style.letterSpacing = `${fit.tracking}em`;
      }

      document.fonts.ready.then(() => {
        [...WORD_CONTENT, ...HEADLINE_SEQUENCE].forEach((entry) => {
          fittedSizes.set(entry.text, measureHeadline(entry.text));
        });
        const currentText = headlineEl.textContent;
        const fit = fittedSizes.get(currentText);
        if (fit) {
          headlineEl.style.fontSize = `${fit.size}px`;
          headlineEl.style.letterSpacing = `${fit.tracking}em`;
        }
      });

      document.querySelectorAll("[class~='f01-o-salto-transfer'] path").forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[frameId] = tl;

      const driver = { t: 0 };
      let lastHeadlineKey = "";
      let lastLanguageState = "ESPECIALISTA";
      tl.to(driver, {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: () => {
          const entry = headlineAt(driver.t);
          if (entry.key !== lastHeadlineKey) {
            applyHeadline(entry);
            lastHeadlineKey = entry.key;
          }
          const nextLanguageState = driver.t >= 2.72 ? "TRAVADO AQUI" : "ESPECIALISTA";
          if (nextLanguageState !== lastLanguageState) {
            languageStateEl.textContent = nextLanguageState;
            lastLanguageState = nextLanguageState;
          }
        }
      }, 0);

      tl.fromTo("[id='f01-o-salto-headline']", {
        opacity: 0,
        y: 24,
        scale: 0.96
      }, {
        opacity: 1,
        y: 0,
        scale: 1,
        duration: 0.46,
        ease: "power2.out"
      }, 0);

      tl.to("[id='f01-o-salto-hairline']", {
        width: 918,
        duration: 0.68,
        ease: "power2.out"
      }, 0.72);

      tl.fromTo("[id='f01-o-salto-card-language']", {
        opacity: 0,
        y: 26
      }, {
        opacity: 1,
        y: 0,
        duration: 0.48,
        ease: "power2.out"
      }, 0.42);

      tl.fromTo("[id='f01-o-salto-meter-fill']", {
        scaleX: 0
      }, {
        scaleX: 0.72,
        duration: 0.82,
        ease: "power2.out"
      }, 1.82);

      tl.to("[id='f01-o-salto-path-a']", {
        strokeDashoffset: 0,
        duration: 0.74,
        ease: "power2.out"
      }, 3.42);

      tl.fromTo("[id='f01-o-salto-card-vision']", {
        opacity: 0,
        y: 28
      }, {
        opacity: 1,
        y: 0,
        duration: 0.46,
        ease: "power2.out"
      }, 3.94);

      tl.to("[id='f01-o-salto-path-b']", {
        strokeDashoffset: 0,
        duration: 0.74,
        ease: "power2.out"
      }, 4.36);

      tl.fromTo("[id='f01-o-salto-card-action']", {
        opacity: 0,
        y: 28
      }, {
        opacity: 1,
        y: 0,
        duration: 0.46,
        ease: "power2.out"
      }, 4.88);

      tl.fromTo("[id='f01-o-salto-transfer-label']", {
        opacity: 0,
        y: 16
      }, {
        opacity: 1,
        y: 0,
        duration: 0.42,
        ease: "power1.out"
      }, 5.24);
    })();
  </script>
