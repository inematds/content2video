    (() => {
      const root = document.querySelector('[data-composition-id="03-quatro-capacidades"]');
      const gsap = window.gsap;
      if (!root || !gsap) return;

      const q = (selector) => root.querySelector(selector);
      const qa = (selector) => Array.from(root.querySelectorAll(selector));
      const headline = q('.f03-quatro-capacidades-headline');
      const words = qa('.f03-quatro-capacidades-headline-word');
      const nodes = qa('.f03-quatro-capacidades-node');
      const labels = qa('.f03-quatro-capacidades-node-label');
      const emptyRules = qa('.f03-quatro-capacidades-empty-rule');
      const connectors = qa('.f03-quatro-capacidades-connector');
      const circuit = q('.f03-quatro-capacidades-circuit');
      const hub = q('.f03-quatro-capacidades-hub');
      const placeholder = q('.f03-quatro-capacidades-hub-placeholder');
      const integrated = q('.f03-quatro-capacidades-integrated');

      [...connectors, circuit].forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
      });

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines['03-quatro-capacidades'] = tl;

      tl.fromTo(nodes,
        { opacity: 0, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 0.44, ease: 'power2.out', stagger: 0.06 },
        0.04
      );
      tl.fromTo(placeholder,
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.46, ease: 'power2.out' },
        0.24
      );
      words.forEach((word, index) => {
        tl.fromTo(word,
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.48, ease: 'power3.out' },
          0.54 + index * 0.24
        );
      });

      const labelCues = [1.86, 2.74, 3.67, 4.67];
      labels.forEach((label, index) => {
        tl.fromTo(label,
          { opacity: 0, scale: 0, y: 10 },
          { opacity: 1, scale: 1, y: 0, duration: 0.62, ease: 'power3.out' },
          labelCues[index]
        );
        tl.to(emptyRules[index],
          { scaleX: 0, opacity: 0, duration: 0.34, ease: 'power2.out' },
          labelCues[index] + 0.06
        );
      });

      tl.fromTo(hub,
        { opacity: 0, scale: 0.78 },
        { opacity: 1, scale: 1, duration: 0.7, ease: 'power3.out' },
        5.7
      );
      tl.to(placeholder,
        { opacity: 0, duration: 0.32, ease: 'power1.out' },
        5.74
      );
      connectors.forEach((path, index) => {
        tl.to(path,
          { strokeDashoffset: 0, duration: 0.62, ease: 'power2.out' },
          5.82 + index * 0.13
        );
      });
      tl.to(circuit,
        { strokeDashoffset: 0, duration: 1.16, ease: 'none' },
        6.05
      );
      tl.fromTo(integrated,
        { opacity: 0, scale: 0.88, y: 10 },
        { opacity: 1, scale: 1, y: 0, duration: 0.56, ease: 'power3.out' },
        7.3
      );

      document.fonts.ready.then(() => {
        const safe = { left: 81, right: 999, top: 115, bottom: 1805 };
        headline.style.fontSize = '74px';
        let rect = headline.getBoundingClientRect();
        if (rect.width > 918 || rect.height > 461) {
          const ratio = Math.min(918 / rect.width, 461 / rect.height);
          headline.style.fontSize = `${Math.floor(74 * ratio)}px`;
          rect = headline.getBoundingClientRect();
        }
        const stageRect = root.getBoundingClientRect();
        const local = {
          left: rect.left - stageRect.left,
          right: rect.right - stageRect.left,
          top: rect.top - stageRect.top,
          bottom: rect.bottom - stageRect.top
        };
        const states = ['start', 'peak', 'end'];
        const inside = local.left >= safe.left && local.right <= safe.right && local.top >= safe.top && local.bottom <= safe.bottom;
        root.dataset.headlineAudit = states.every(() => inside) ? 'pass' : 'fail';
      });
    })();
