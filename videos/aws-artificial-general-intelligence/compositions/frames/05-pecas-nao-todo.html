  <script>
    (() => {
      const frameId = "05-pecas-nao-todo";
      const tl = gsap.timeline({ paused: true });

      const anchor = document.getElementById("f05-anchor");
      const slotShell = document.getElementById("f05-slot-shell");
      const slotText = document.getElementById("f05-slot-text");
      const slotIndex = document.getElementById("f05-slot-index");
      const finalCallout = document.getElementById("f05-final");
      const ringPath = document.getElementById("f05-ring-path");
      const modules = [
        document.getElementById("f05-module-1"),
        document.getElementById("f05-module-2"),
        document.getElementById("f05-module-3"),
        document.getElementById("f05-module-4"),
        document.getElementById("f05-module-5")
      ];

      const states = [
        { t: 1.90, text: "APRENDIZADO PROFUNDO", index: "01/05" },
        { t: 2.88, text: "IA GENERATIVA", index: "02/05" },
        { t: 3.86, text: "LINGUAGEM", index: "03/05" },
        { t: 4.84, text: "VISÃO", index: "04/05" },
        { t: 5.82, text: "ROBÓTICA", index: "05/05" }
      ];

      function stateAt(time) {
        for (let i = states.length - 1; i >= 0; i -= 1) {
          if (time >= states[i].t) return states[i];
        }
        return { text: "", index: "01/05" };
      }

      function fitHeadline(element, maxWidth, maxHeight, minSize) {
        let size = parseFloat(getComputedStyle(element).fontSize);
        while (size > minSize) {
          const box = element.getBoundingClientRect();
          if (box.width <= maxWidth && box.height <= maxHeight) break;
          size -= 2;
          element.style.fontSize = `${size}px`;
        }
      }

      document.fonts.ready.then(() => {
        fitHeadline(anchor, 780, 226, 110);
        fitHeadline(finalCallout, 278, 112, 24);
      });

      tl.fromTo(anchor,
        { autoAlpha: 0, scale: 0.96 },
        { autoAlpha: 1, scale: 1, duration: 0.48, ease: "power2.out" },
        0
      );

      tl.fromTo(slotShell,
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.24, ease: "power1.out" },
        1.78
      );

      const driver = { t: 0 };
      tl.to(driver, {
        t: 10.2,
        duration: 10.2,
        ease: "none",
        onUpdate: () => {
          const state = stateAt(driver.t);
          slotText.textContent = state.text;
          slotIndex.textContent = state.index;
        }
      }, 0);

      const outward = [
        { x: 0, y: -24 },
        { x: -24, y: -8 },
        { x: 24, y: -8 },
        { x: -18, y: 22 },
        { x: 18, y: 22 }
      ];

      states.forEach((state, index) => {
        tl.fromTo(modules[index],
          { autoAlpha: 0, scale: 0.94, x: outward[index].x * 2, y: outward[index].y * 2 },
          {
            autoAlpha: 1,
            scale: 1,
            x: outward[index].x,
            y: outward[index].y,
            duration: 0.36,
            ease: "power2.out"
          },
          state.t
        );
      });

      modules.forEach((module) => {
        tl.to(module, {
          x: 0,
          y: 0,
          duration: 0.72,
          ease: "power2.out"
        }, 6.8);
      });

      tl.to(slotShell, { autoAlpha: 0.28, duration: 0.42, ease: "power1.out" }, 6.8);
      tl.to(ringPath, { strokeDashoffset: 0, duration: 1.08, ease: "power2.inOut" }, 6.84);

      tl.fromTo(finalCallout,
        { autoAlpha: 0, scale: 0.96, color: "#cc785c" },
        { autoAlpha: 1, scale: 1, color: "#cc785c", duration: 0.28, ease: "power2.out" },
        8.6
      );
      tl.to(finalCallout, { color: "#faf9f5", duration: 0.34, ease: "power1.out" }, 8.88);

      window.__timelines = window.__timelines || {};
      window.__timelines[frameId] = tl;
    })();
  </script>
