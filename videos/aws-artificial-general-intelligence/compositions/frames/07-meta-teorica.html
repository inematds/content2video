      const gapLine = document.getElementById("f07-gap-line");
      const headlines = Array.from(root.querySelectorAll(".f07-headline"));

      function fitHeadline(element, maxWidth, maxHeight, minSize) {
        let size = parseFloat(getComputedStyle(element).fontSize);
        while (size > minSize) {
          const box = element.getBoundingClientRect();
          if (box.width <= maxWidth && box.height <= maxHeight && element.scrollWidth <= maxWidth && element.scrollHeight <= maxHeight) break;
          size -= 2;
          element.style.fontSize = `${size}px`;
          if (size < 92) element.style.letterSpacing = "-0.03em";
        }
      }

      function validateHeadlineSafeArea() {
        const safe = { left: 81, right: 999, top: 115, bottom: 1805, width: 918, height: 461 };
        const allSafe = headlines.every((element) => {
          const box = element.getBoundingClientRect();
          return box.left >= safe.left && box.right <= safe.right && box.top >= safe.top && box.bottom <= safe.bottom && box.width <= safe.width && box.height <= safe.height;
        });
        root.dataset.headlineSafe = allSafe ? "true" : "false";
      }

      document.fonts.ready.then(() => {
        headlines.forEach((headline) => fitHeadline(headline, 804, 252, 72));
        validateHeadlineSafeArea();
      });

      tl.fromTo(cardMeta,
        { autoAlpha: 0, scale: 0.95 },
        { autoAlpha: 1, scale: 1, duration: 0.52, ease: "power2.out" },

      tl.set(cardMeta, { autoAlpha: 0 }, 2.2);
      tl.set(cardContrast, { autoAlpha: 1, "--dof": "0px" }, 2.2);
      tl.to(major, { opacity: 0.23, duration: 0.58, ease: "power1.out" }, 2.62);

      tl.to(cardContrast, {
        "--dof": "10px",
        opacity: 0.15,
        duration: 0.2,

      }, 4.8);
      tl.set(cardDefinition, { autoAlpha: 0.15, "--dof": "10px" }, 4.8);
      tl.set(intelligence, { autoAlpha: 1 }, 4.8);
      tl.set(reallyGeneral, { autoAlpha: 0, y: 34 }, 4.8);
      tl.set(cardContrast, { autoAlpha: 0 }, 5.0);
      tl.to(cardDefinition, {
