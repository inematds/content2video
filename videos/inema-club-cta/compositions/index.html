<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>INEMA.CLUB — CTA</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Space Grotesk";
        src: url("assets/fonts/space-grotesk-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Space Grotesk";
        src: url("assets/fonts/space-grotesk-600.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Space Grotesk";
        src: url("assets/fonts/space-grotesk-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }

      :root {
        --navy: #071a33;
        --cyan: #00d4ff;
        --white: #f4faff;
        --safe-x: 81px;
        --safe-y: 116px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: var(--navy);
      }

      body {
        font-family: "Space Grotesk", sans-serif;
      }

      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 43%, rgba(0, 212, 255, 0.09), transparent 34%),
          var(--navy);
        color: var(--white);
      }

      .clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .safe-frame {
        position: absolute;
        inset: var(--safe-y) var(--safe-x);
        overflow: hidden;
      }

      .brand-axis {
        position: absolute;
        left: 50%;
        top: 565px;
        width: 2px;
        height: 590px;
        background: linear-gradient(180deg, transparent, rgba(0, 212, 255, 0.28), transparent);
        transform: translateX(-50%);
      }

      .axis-dot {
        position: absolute;
        left: 50%;
        top: 851px;
        width: 12px;
        height: 12px;
        border: 2px solid var(--cyan);
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }

      .verb-layer,
      .lockup {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .verb {
        max-width: 918px;
        margin: 0;
        color: var(--white);
        font-size: 170px;
        font-weight: 700;
        line-height: 0.96;
        letter-spacing: -0.045em;
        text-transform: uppercase;
        white-space: nowrap;
        transform-origin: 50% 56%;
      }

      .verb em {
        color: var(--cyan);
        font-style: normal;
      }

      .verb,
      .trace,
      .lockup {
        opacity: 0;
        visibility: hidden;
      }

      .trace {
        position: absolute;
        left: 50%;
        top: calc(50% + 104px);
        width: 540px;
        height: 8px;
        border-radius: 999px;
        background: var(--cyan);
        transform: translateX(-50%);
        transform-origin: center;
      }

      #trace-pratique {
        width: 690px;
        height: 3px;
        transform: translateX(-50%) rotate(-2deg);
      }

      #trace-evolua {
        width: 430px;
        height: 12px;
        opacity: 0.78;
      }

      .lockup {
        flex-direction: column;
        gap: 0;
      }

      .signature {
        width: 880px;
        margin: 0 0 76px;
        color: var(--white);
        font-size: 69px;
        font-weight: 700;
        line-height: 1.04;
        letter-spacing: -0.042em;
        text-transform: uppercase;
      }

      .signature span {
        color: var(--cyan);
      }

      .lock-rule {
        width: 144px;
        height: 6px;
        margin-bottom: 78px;
        border-radius: 999px;
        background: var(--cyan);
      }

      .cta {
        width: 880px;
        margin: 0 0 54px;
        font-size: 78px;
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -0.038em;
      }

      .cta strong {
        display: block;
        margin-top: 10px;
        color: var(--cyan);
        font-weight: 700;
      }

      .url {
        display: inline-flex;
        min-width: 402px;
        min-height: 92px;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 18px 42px;
        border: 2px solid rgba(0, 212, 255, 0.62);
        border-radius: 999px;
        color: var(--white);
        font-size: 45px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0.035em;
      }

      #headline-audit-error {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 120px;
        background: var(--navy);
        color: var(--white);
        font: 600 42px/1.25 "Space Grotesk", sans-serif;
        text-align: center;
      }

      #stage[data-headline-validation="failed"] #headline-audit-error {
        display: flex;
      }
    </style>
  </head>
  <body>
    <main data-hf-id="hf-jk3a" id="stage" data-composition-id="inema-club-cta" data-start="0" data-duration="5.5" data-fps="30" data-width="1080" data-height="1920" data-headline-validation="pending">
      <section data-hf-id="hf-l67w" id="cta-card" class="clip" data-start="0" data-duration="5.5" data-track-index="0" aria-label="Continue aprendendo no INEMA.CLUB">
        <div data-hf-id="hf-io0v" class="safe-frame">
          <div data-hf-id="hf-1bbe" class="brand-axis" aria-hidden="true"></div>
          <div data-hf-id="hf-s0i4" class="axis-dot" aria-hidden="true"></div>

          <div data-hf-id="hf-8k0j" id="scene-aprenda" class="verb-layer">
            <h1 data-hf-id="hf-o1lk" id="headline-aprenda" class="verb">APRENDA<em data-hf-id="hf-cjuj">.</em></h1>
            <div data-hf-id="hf-tv8l" id="trace-aprenda" class="trace" aria-hidden="true"></div>
          </div>

          <div data-hf-id="hf-y0hl" id="scene-pratique" class="verb-layer">
            <h2 data-hf-id="hf-7p9d" id="headline-pratique" class="verb">PRATIQUE<em data-hf-id="hf-5xrv">.</em></h2>
            <div data-hf-id="hf-nse3" id="trace-pratique" class="trace" aria-hidden="true"></div>
          </div>

          <div data-hf-id="hf-x1wq" id="scene-evolua" class="verb-layer">
            <h2 data-hf-id="hf-rwkb" id="headline-evolua" class="verb">EVOLUA<em data-hf-id="hf-5jgu">.</em></h2>
            <div data-hf-id="hf-aw94" id="trace-evolua" class="trace" aria-hidden="true"></div>
          </div>

          <div data-hf-id="hf-6cvf" id="final-lockup" class="lockup">
            <p data-hf-id="hf-4os2" id="headline-signature" class="signature">
              APRENDA. PRATIQUE. <span data-hf-id="hf-dxgf">EVOLUA.</span>
            </p>
            <div data-hf-id="hf-gy0f" class="lock-rule" aria-hidden="true"></div>
            <p data-hf-id="hf-l3rc" id="headline-cta" class="cta">Continue no <strong data-hf-id="hf-6g8o">INEMA.CLUB</strong></p>
            <p data-hf-id="hf-w97i" id="headline-url" class="url">inema.club</p>
          </div>
        </div>
      </section>
      <div data-hf-id="hf-8dlu" id="headline-audit-error" role="alert">
        Prévia bloqueada: uma manchete ultrapassou a área segura.
      </div>
    </main>

    <script>
      (function () {
        "use strict";

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        tl.fromTo(
          "#headline-aprenda",
          { y: 120, scaleX: 0.94, scaleY: 1.08, autoAlpha: 0 },
          { y: 0, scaleX: 1, scaleY: 1, autoAlpha: 1, duration: 0.2, ease: "power4.out" },
          0,
        );
        tl.fromTo(
          "#trace-aprenda",
          { scaleX: 0, autoAlpha: 0 },
          { scaleX: 1, autoAlpha: 1, duration: 0.24, ease: "power3.out" },
          0.12,
        );
        tl.to("#scene-aprenda", { autoAlpha: 0, duration: 0.12, ease: "power2.in" }, 0.78);

        tl.fromTo(
          "#headline-pratique",
          { x: 32, scaleX: 0.96, autoAlpha: 0 },
          { x: 0, scaleX: 1, autoAlpha: 1, duration: 0.2, ease: "expo.out" },
          0.9,
        );
        tl.fromTo(
          "#trace-pratique",
          { scaleX: 0, autoAlpha: 0 },
          { scaleX: 1, autoAlpha: 1, duration: 0.24, ease: "power3.out" },
          1.02,
        );
        tl.to("#scene-pratique", { autoAlpha: 0, duration: 0.12, ease: "power2.in" }, 1.68);

        tl.fromTo(
          "#headline-evolua",
          { scale: 0.78, autoAlpha: 0 },
          { scale: 1, autoAlpha: 1, duration: 0.2, ease: "power4.out" },
          1.8,
        );
        tl.fromTo(
          "#trace-evolua",
          { scaleX: 0, autoAlpha: 0 },
          { scaleX: 1, autoAlpha: 0.78, duration: 0.24, ease: "power3.out" },
          1.92,
        );
        tl.to(
          "#headline-evolua",
          { textShadow: "0 0 34px rgba(0, 212, 255, 0.48)", duration: 0.1, ease: "sine.out" },
          2,
        );
        tl.to(
          "#headline-evolua",
          { textShadow: "0 0 0 rgba(0, 212, 255, 0)", duration: 0.2, ease: "sine.in" },
          2.1,
        );

        tl.to(
          "#scene-evolua",
          { scale: 0.22, autoAlpha: 0, duration: 0.4, ease: "power3.in" },
          3.4,
        );
        tl.fromTo(
          "#final-lockup",
          { y: 24, scale: 0.96, autoAlpha: 0 },
          { y: 0, scale: 1, autoAlpha: 1, duration: 0.2, ease: "power2.out" },
          3.8,
        );

        // Extends the deterministic composition to 5.5s without changing a visual property.
        // The rendered lockup is therefore pixel-still from 4.0s through the final frame.
        tl.to({}, { duration: 1.5 }, 4);

        window.__timelines["inema-club-cta"] = tl;
        tl.seek(0);

        var SAFE = { left: 81, right: 999, top: 116, bottom: 1804 };
        var AUDIT_POINTS = [
          { time: 0, ids: ["headline-aprenda"] },
          { time: 0.2, ids: ["headline-aprenda"] },
          { time: 0.9, ids: ["headline-aprenda"] },
          { time: 0.9, ids: ["headline-pratique"] },
          { time: 1.1, ids: ["headline-pratique"] },
          { time: 1.8, ids: ["headline-pratique"] },
          { time: 1.8, ids: ["headline-evolua"] },
          { time: 2, ids: ["headline-evolua"] },
          { time: 3.8, ids: ["headline-evolua"] },
          {
            time: 3.8,
            ids: ["headline-signature", "headline-cta", "headline-url"],
          },
          {
            time: 4,
            ids: ["headline-signature", "headline-cta", "headline-url"],
          },
          {
            time: 5.5,
            ids: ["headline-signature", "headline-cta", "headline-url"],
          },
        ];

        function auditHeadlines() {
          var stage = document.getElementById("stage");
          var previousTime = tl.time();
          var failures = [];

          AUDIT_POINTS.forEach(function (point) {
            tl.seek(point.time, true);
            point.ids.forEach(function (id) {
              var rect = document.getElementById(id).getBoundingClientRect();
              if (
                rect.left < SAFE.left - 0.5 ||
                rect.right > SAFE.right + 0.5 ||
                rect.top < SAFE.top - 0.5 ||
                rect.bottom > SAFE.bottom + 0.5
              ) {
                failures.push({
                  id: id,
                  time: point.time,
                  rect: {
                    left: rect.left,
                    right: rect.right,
                    top: rect.top,
                    bottom: rect.bottom,
                  },
                });
              }
            });
          });

          tl.seek(previousTime, true);
          stage.dataset.headlineValidation = failures.length ? "failed" : "passed";
          window.__headlineAuditResult = {
            passed: failures.length === 0,
            safeArea: SAFE,
            checks: AUDIT_POINTS.length,
            failures: failures,
          };

          if (failures.length) {
            throw new Error("Headline safe-area validation failed: " + JSON.stringify(failures));
          }

          return window.__headlineAuditResult;
        }

        window.__headlineAudit = document.fonts.ready.then(auditHeadlines);
      })();
    </script>
  </body>
</html>
