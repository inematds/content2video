      const seriesLength = series.getTotalLength();
      series.style.strokeDasharray = seriesLength;
      series.style.strokeDashoffset = seriesLength;

      const scrubState = { p: 0 };
      let lastIndex = -1;
      const applyScrub = function () {
        const f = scrubState.p * (DATA.length - 1);
        const i = Math.min(DATA.length - 2, Math.floor(f));
        const local = f - i;
        const x = xAt(i) + (xAt(i + 1) - xAt(i)) * local;
        const y = yAt(DATA[i].v) + (yAt(DATA[i + 1].v) - yAt(DATA[i].v)) * local;
        trackLine.setAttribute("x1", x);
        trackLine.setAttribute("x2", x);
        marker.setAttribute("cx", x);
        marker.setAttribute("cy", y);
        const rightSide = x > 640;
        tooltip.style.transform = "translate(" + (x + (rightSide ? -158 : 22)) + "px," + (y - 54) + "px)";
        cursor.style.transform = "translate(" + (x + 5) + "px," + (y + 5) + "px)";
        const nearest = Math.round(f);
        if (nearest !== lastIndex) {
          tooltip.textContent = DATA[nearest].d;
          lastIndex = nearest;
        }
      };
      applyScrub();

      tl.fromTo(series,
        { strokeDashoffset: seriesLength },
        { strokeDashoffset: 0, duration: 1.65, ease: "power2.out" },
        3.15
      );
      tl.fromTo([trackLine, marker, tooltip, cursor],
        { opacity: 0 },
        { opacity: 1, duration: 0.34, ease: "power2.out" },
        5.72
      );
      tl.fromTo(tooltip,
        { scale: 0.7 },
        { scale: 1, duration: 0.5, ease: "power3.out" },
        5.72
      );
      tl.to(scrubState, {
        p: 1,
        duration: 2.0,
        ease: "power1.inOut",
        onUpdate: applyScrub
      }, 5.75);

      [1, 2, 3].forEach(function (n, i) {
        tl.fromTo(byId("f04-meca-mencoes-readout-" + n),
          { scale: 0, opacity: 0, y: 14 },
          { scale: 1, opacity: 1, y: 0, duration: 0.62, ease: "power3.out" },
          7.82 + i * 0.68
        );
      });

      tl.to([planeA, planeB, dashboard],
        { rotationY: 0, rotationX: 0, duration: 1.0, ease: "power3.out" },
        8.12
      );
      tl.to(assetWrap,
        { filter: "blur(0px)", duration: 0.5, ease: "power2.out" },
        9.18
      );
    });
  </script>
</template>
