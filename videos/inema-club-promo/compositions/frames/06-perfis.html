  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="06-perfis"]');
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["06-perfis"] = tl;

      const anchor = root.querySelector("#f06-perfis-anchor");
      const anchorWords = Array.from(root.querySelectorAll(".f06-perfis-anchor-word"));
      const cardZone = root.querySelector("#f06-perfis-card-zone");
      const label = root.querySelector("#f06-perfis-label");
      const cardShell = root.querySelector("#f06-perfis-card-shell");
      const cards = Array.from(root.querySelectorAll(".f06-perfis-card-image"));
      const markers = Array.from(root.querySelectorAll(".f06-perfis-marker"));
      const lockup = root.querySelector("#f06-perfis-lockup");

      const ANCHOR_CONTENT = ["USE", "IA", "PARA", "EVOLUIR"];
      const ANCHOR_BASE = 0.16;
      const ANCHOR_SEC_PER_CHAR = 0.035;
      let anchorCumulative = 0;
      const ANCHOR_TIMELINE = ANCHOR_CONTENT.map((word, index) => {
        const start = anchorCumulative;
        anchorCumulative += ANCHOR_BASE + word.length * ANCHOR_SEC_PER_CHAR;
        return { word, index, start, end: anchorCumulative };
      });
      const anchorScale = 1.42 / anchorCumulative;

      const anchorDriver = { t: 0 };
      let lastAnchorCount = -1;

      tl.set(anchorWords, { opacity: 0, y: 20 }, 0);
      tl.fromTo(anchor, { opacity: 0, scale: 0.975 }, { opacity: 1, scale: 1, duration: 0.42, ease: "power2.out" }, 0.04);
      tl.to(anchorDriver, {
        t: anchorCumulative,
        duration: anchorCumulative * anchorScale,
        ease: "none",
        onUpdate: () => {
          let activeIndex = 0;
          for (let i = ANCHOR_TIMELINE.length - 1; i >= 0; i -= 1) {
            if (anchorDriver.t >= ANCHOR_TIMELINE[i].start) {
              activeIndex = i;
              break;
            }
          }
          const visibleCount = activeIndex + 1;
          if (visibleCount !== lastAnchorCount) {
            anchorWords.forEach((word, index) => {
              gsap.set(word, { opacity: index < visibleCount ? 1 : 0, y: index < visibleCount ? 0 : 20 });
            });
            lastAnchorCount = visibleCount;
          }
        }
      }, 0.08);

      const CARD_STATES = [
        { start: 1.8, key: "produzir", label: "PRODUZIR MELHOR", marker: 0, resolved: false },
        { start: 3.15, key: "liderar", label: "LIDERAR", marker: 1, resolved: false },
        { start: 4.55, key: "negocio", label: "CRIAR UM NEGÓCIO", marker: 2, resolved: false },
        { start: 5.8, key: "negocio", label: "ACELERAR A CARREIRA", marker: 3, resolved: true }
      ];

      function cardStateAt(time) {
        for (let i = CARD_STATES.length - 1; i >= 0; i -= 1) {
          if (time >= CARD_STATES[i].start) return CARD_STATES[i];
        }
        return CARD_STATES[0];
      }

      tl.set(cards, { opacity: 0 }, 0);
      tl.set(cards[0], { opacity: 1 }, 0);
      tl.fromTo(cardZone, { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.48, ease: "power2.out" }, 1.32);

      const cardDriver = { t: 1.8 };
      let lastCardState = "";
      tl.to(cardDriver, {
        t: 6.9,
        duration: 5.1,
        ease: "none",
        onUpdate: () => {
          const state = cardStateAt(cardDriver.t);
          const stateId = `${state.key}:${state.label}`;
          if (stateId !== lastCardState) {
            label.textContent = state.label;
            cards.forEach((card) => {
              card.style.opacity = card.dataset.cardKey === state.key ? "1" : "0";
            });
            markers.forEach((marker, index) => {
              marker.dataset.active = index === state.marker ? "true" : "false";
            });
            label.style.color = state.resolved ? "#1a1f3a" : "#00d9ff";
            label.style.backgroundColor = state.resolved ? "#00d9ff" : "rgba(0, 217, 255, 0.08)";
            label.style.borderColor = state.resolved ? "#00d9ff" : "rgba(0, 217, 255, 0.2)";
            cardShell.style.borderColor = state.resolved ? "#00d9ff" : "rgba(0, 217, 255, 0.2)";
            lastCardState = stateId;
          }
        }
      }, 1.8);

      tl.fromTo(lockup, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 6.9);
    })();
  </script>
