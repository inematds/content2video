  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const DURATION = 8.304;
      const counter = document.getElementById("ff05-projetos-counter");
      const ring = document.getElementById("ff05-projetos-ring");
      const camera = document.getElementById("ff05-projetos-camera");
      const countStage = document.getElementById("ff05-projetos-count-stage");
      const proofStage = document.getElementById("ff05-projetos-proof-stage");
      const kicker = document.getElementById("ff05-projetos-proof-kicker");
      const finalStat = document.getElementById("ff05-projetos-final-stat");
      const counterLabel = document.getElementById("ff05-projetos-counter-label");
      const pills = Array.from(document.querySelectorAll(".ff05-projetos-pill"));

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["05-projetos"] = tl;

      const ringLength = ring.getTotalLength();
      ring.style.strokeDasharray = ringLength;
      ring.style.strokeDashoffset = ringLength;

      const countState = { value: 0 };
      const cameraPhase = { scale: 0.98, x: 0, y: 0 };
      const drift = { p: 0 };

      gsap.set(proofStage, { opacity: 0, scale: 0.72, filter: "blur(20px)" });
      gsap.set(kicker, { opacity: 0, y: 28 });
      gsap.set(pills, { opacity: 0, y: 34, scale: 0.9 });
      gsap.set(finalStat, { opacity: 0, x: 90, scale: 0.88 });

      tl.fromTo(countStage, { opacity: 0.3, scale: 0.86, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0);
      tl.to(countState, {
        value: 400,
        duration: 2.3,
        ease: "power3.out",
        onUpdate: () => { counter.textContent = Math.round(countState.value).toLocaleString("pt-BR"); }
      }, 0.2);
      tl.fromTo(counter, { scale: 0.48 }, { scale: 1, duration: 2.3, ease: "power3.out" }, 0.2);
      tl.to(ring, { strokeDashoffset: ringLength * 0.08, duration: 2.3, ease: "power3.out" }, 0.2);
      tl.fromTo(counterLabel, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.65);

      tl.to(countStage, { scale: 2.15, opacity: 0.15, filter: "blur(20px)", duration: 0.34, ease: "power3.in" }, 2.68);
      tl.set(countStage, { opacity: 0 }, 3.02);
      tl.set(proofStage, { opacity: 0.15, scale: 0.72, filter: "blur(20px)" }, 3.02);
      tl.to(proofStage, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.72, ease: "expo.out" }, 3.02);
      tl.fromTo(kicker, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 3.28);

      const pillContent = ["Baixar", "Estudar", "Adaptar", "Usar"];
      const sequenceWindow = 1.18;
      const weights = pillContent.map((item) => 0.6 + item.length * 0.045);
      const totalWeight = weights.reduce((sum, value) => sum + value, 0);
      let elapsed = 0;
      const pillStarts = weights.map((weight) => {
        const start = 5.54 + (elapsed / totalWeight) * sequenceWindow;
        elapsed += weight;
        return start;
      });
      pills.forEach((pill, index) => {
        tl.fromTo(pill, { opacity: 0, y: 34, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "back.out(1.55)" }, pillStarts[index]);
      });

      tl.to(proofStage, { x: -126, y: 138, scale: 0.65, duration: 0.72, ease: "power3.inOut" }, 6.86);
      tl.fromTo(finalStat, { opacity: 0, x: 90, scale: 0.88 }, { opacity: 1, x: 0, scale: 1, duration: 0.72, ease: "power3.out" }, 6.98);

      tl.to(cameraPhase, { scale: 1.075, x: 0, y: -18, duration: 1.45, ease: "power2.inOut" }, 2.62);
      tl.to(cameraPhase, { scale: 1, x: 0, y: 0, duration: 1.05, ease: "power3.out" }, 6.9);
      tl.to(drift, {
        p: Math.PI * 2 * 0.7,
        duration: DURATION,
        ease: "none",
        onUpdate: () => {
          const dx = Math.sin(drift.p) * 4;
          const dy = Math.sin(drift.p * 1.31) * 2;
          camera.style.transform = `translate(${cameraPhase.x + dx}px, ${cameraPhase.y + dy}px) scale(${cameraPhase.scale})`;
        }
      }, 0);
    })();
  </script>
