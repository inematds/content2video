  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["01-direcao"] = tl;

      const questionText = document.getElementById("f01-direcao-question-text");
      const caret = document.getElementById("f01-direcao-caret");
      const fullQuestion = "MAIS UMA LISTA?";
      const typeDriver = { v: 0 };
      const blinkDriver = { p: 0 };

      questionText.textContent = "";
      caret.style.opacity = "1";

      tl.fromTo(
        '[class~="f01-direcao-edge"]',
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 0.82, duration: 1.15, ease: "power3.out", stagger: 0.08 },
        0
      );

      tl.to(typeDriver, {
        v: fullQuestion.length,
        duration: 1.28,
        ease: "power1.inOut",
        onUpdate: () => {
          questionText.textContent = fullQuestion.substring(0, Math.floor(typeDriver.v));
        }
      }, 0.08);

      tl.to(blinkDriver, {
        p: Math.PI * 6,
        duration: 1.55,
        ease: "none",
        onUpdate: () => {
          caret.style.opacity = Math.sin(blinkDriver.p) > 0 ? "1" : "0";
        }
      }, 0);
      tl.set(caret, { opacity: 0 }, 1.56);

      tl.fromTo(
        "#f01-direcao-ticker-label",
        { x: 230, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.34, ease: "power4.out" },
        1.6
      );
      tl.fromTo(
        "#f01-direcao-ticker",
        { x: 230, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.34, ease: "power4.out" },
        1.66
      );

      const tickerStack = document.getElementById("f01-direcao-stack");
      const tickerSprings = [{ p: 0 }, { p: 0 }];
      const applyTicker = () => {
        const total = tickerSprings.reduce((sum, spring) => sum + spring.p, 0);
        tickerStack.style.transform = `translateY(${-total * 146}px)`;
      };
      applyTicker();

      tickerSprings.forEach((spring, index) => {
        tl.to(spring, {
          p: 1,
          duration: 0.58,
          ease: "back.out(1.8)",
          onUpdate: applyTicker
        }, 2.48 + index * 0.46);
      });

      const officialCard = document.getElementById("f01-direcao-official-card");
      tl.fromTo(
        officialCard,
        { opacity: 0, scale: 0.93, y: 92, filter: "blur(18px)" },
        { opacity: 0.58, scale: 1, y: 0, filter: "blur(8px)", duration: 1.15, ease: "power2.out" },
        4.4
      );

      const path = document.getElementById("f01-direcao-path");
      const victim = document.getElementById("f01-direcao-noise-group");
      const streakBlur = document.getElementById("f01-direcao-streak-blur");
      const collision = { p: 0 };
      const collisionDuration = 1.08;
      streakBlur.setAttribute("stdDeviation", "24 0");

      tl.to(collision, {
        p: 1,
        duration: collisionDuration,
        ease: "power2.out",
        onUpdate: () => {
          const intruderX = 1180 * (1 - collision.p);
          const intruderOpacity = Math.min(1, collision.p * 6);
          const intruderRotation = -8 * (1 - collision.p);
          const victimP = Math.min(1, collision.p / 0.48);
          const victimX = -1180 * victimP;
          const blurAmount = 24 * (1 - collision.p);

          path.style.transform = `translateX(${intruderX}px) rotate(${intruderRotation}deg)`;
          path.style.opacity = String(intruderOpacity);
          victim.style.transform = `translateX(${victimX}px) rotate(${-12 * victimP}deg)`;
          victim.style.opacity = String(1 - victimP);
          streakBlur.setAttribute("stdDeviation", `${blurAmount} 0`);
        }
      }, 4.4);

      tl.to(officialCard, {
        opacity: 1,
        filter: "blur(0px)",
        duration: 0.52,
        ease: "power3.out"
      }, 6.2);

      tl.fromTo(
        "#f01-direcao-final-line",
        { x: 230, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power4.out" },
        6.2
      );
    })();
  </script>
