  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="02-jornada"]');
      const camera = root.querySelector('#f02-jornada-camera');
      const target = root.querySelector('#f02-jornada-target');
      const zoomOuter = root.querySelector('#f02-jornada-zoom-outer');
      const zoomInner = root.querySelector('#f02-jornada-zoom-inner');
      const surface = root.querySelector('#f02-jornada-surface');
      const keywordPanel = root.querySelector('#f02-jornada-keywords');
      const keywords = Array.from(root.querySelectorAll('.ff02-jornada-keyword'));
      const proof = root.querySelector('#f02-jornada-proof');
      const finalPanel = root.querySelector('#f02-jornada-final');
      const finalWords = Array.from(root.querySelectorAll('.ff02-jornada-final-word'));

      const cameraRect = camera.getBoundingClientRect();
      const targetRect = target.getBoundingClientRect();
      const targetOffsetX = targetRect.left + targetRect.width / 2 - (cameraRect.left + cameraRect.width / 2);
      const targetOffsetY = targetRect.top + targetRect.height / 2 - (cameraRect.top + cameraRect.height / 2);
      const desiredScale = 1.18;
      const maxScale = Math.min(
        (0.88 * cameraRect.width) / targetRect.width,
        (0.88 * cameraRect.height) / targetRect.height
      );
      const zoomScale = Math.min(desiredScale, maxScale);

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        surface,
        { x: 390, rotationY: -8, rotationZ: 1.5, opacity: 0.28 },
        { x: 0, rotationY: 0, rotationZ: 0, opacity: 1, duration: 1.18, ease: 'power3.out' },
        0
      );
      tl.fromTo(
        root.querySelector('.ff02-jornada-brand'),
        { y: -34, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.72, ease: 'power3.out' },
        0.14
      );
      tl.fromTo(
        root.querySelector('.ff02-jornada-tag'),
        { x: 46, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.66, ease: 'power3.out' },
        0.36
      );

      tl.fromTo(
        keywordPanel,
        { y: 84, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.58, ease: 'power4.out' },
        1.5
      );

      const keywordTimings = {
        aprender: { start: 0.0, end: 0.56 },
        praticar: { start: 0.92, end: 1.56 },
        evoluir: { start: 1.88, end: 2.72 }
      };
      const glowDriver = { t: 0 };
      const attack = 0.18;
      const release = 0.42;
      const restLevel = 0.08;

      function envelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / attack, 1);
        const releaseEnd = end + release;
        if (time < releaseEnd) return 1 - ((time - end) / release) * (1 - restLevel);
        return restLevel;
      }

      function lerpChannel(a, b, amount) {
        return Math.round(a + (b - a) * amount);
      }

      tl.to(
        glowDriver,
        {
          t: 2.9,
          duration: 2.9,
          ease: 'none',
          onUpdate: () => {
            keywords.forEach((word) => {
              const timing = keywordTimings[word.dataset.word];
              const env = envelope(glowDriver.t, timing.start, timing.end);
              const r = lerpChannel(64, 0, env);
              const g = lerpChannel(91, 217, env);
              const b = lerpChannel(113, 255, env);
              word.style.color = `rgb(${r}, ${g}, ${b})`;
              word.style.textShadow = `0 0 ${42 * env}px rgba(0, 217, 255, ${0.72 * env})`;
              word.style.transform = `scale(${1 + 0.19 * env})`;
            });
          }
        },
        1.5
      );

      tl.to(
        zoomOuter,
        { scale: zoomScale, duration: 1.45, ease: 'power3.inOut' },
        4.4
      );
      tl.to(
        zoomInner,
        { x: -targetOffsetX, y: -targetOffsetY, duration: 1.45, ease: 'power3.inOut' },
        4.4
      );
      tl.fromTo(
        target,
        { opacity: 0, scale: 0.82 },
        { opacity: 1, scale: 1, duration: 0.55, ease: 'power3.out' },
        4.78
      );
      tl.fromTo(
        proof,
        { x: 230, opacity: 0.35 },
        { x: 0, opacity: 1, duration: 0.82, ease: 'power4.out' },
        5.0
      );

      const wordContent = finalWords.map((element) => ({
        element,
        text: element.textContent.trim()
      }));
      let cumulative = 0;
      const baseDuration = 0.055;
      const secondsPerCharacter = 0.012;
      const wordTimeline = wordContent.map((entry, index) => {
        const duration = baseDuration + entry.text.length * secondsPerCharacter;
        const start = cumulative;
        cumulative += duration * Math.pow(0.9, index);
        return { ...entry, start };
      });

      tl.fromTo(
        finalPanel,
        { y: 66, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.36, ease: 'power4.out' },
        6.8
      );
      gsap.set(finalWords, { x: 230, opacity: 0 });
      wordTimeline.forEach((entry) => {
        tl.fromTo(
          entry.element,
          { x: 230, opacity: 0.35 },
          { x: 0, opacity: 1, duration: 0.3, ease: 'power4.out' },
          6.86 + entry.start
        );
      });

      window.__timelines = window.__timelines || {};
      window.__timelines['02-jornada'] = tl;
    })();
  </script>
